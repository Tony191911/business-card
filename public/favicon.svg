<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="faviconTitle faviconDesc">
  <title id="faviconTitle">電子名片 Favicon</title>
  <desc id="faviconDesc">單張卡片圖形，填滿畫布，適合小尺寸顯示</desc>

  <!-- 卡片主體，填滿畫布 -->
  <rect x="14" y="44" width="212" height="152" rx="22" fill="#534AB7"/>

  <!-- 卡片內部線條，加粗加大讓小尺寸也看得清楚 -->
  <circle cx="60" cy="90" r="18" fill="#EEEDFE"/>
  <rect x="94" y="78" width="100" height="14" rx="7" fill="#EEEDFE"/>
  <rect x="94" y="100" width="72" height="12" rx="6" fill="#AFA9EC"/>

  <rect x="40" y="140" width="160" height="12" rx="6" fill="#AFA9EC"/>
  <rect x="40" y="164" width="110" height="12" rx="6" fill="#AFA9EC"/>
</svg>
